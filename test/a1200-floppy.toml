# devsoak -R test config: A1200 + KS3.2, scratch ADF in df0
# (trackdisk.device unit 0, genuinely removable), turbo floppy,
# serial to host stdout. Eject/insert driven from the host over CCP:
#   copperline-ctl media.floppy.eject  {"unit":0}
#   copperline-ctl media.floppy.insert {"unit":0,"path":"blank.adf"}
#
# Scratch disk: xdftool blank.adf create + format Scratch ofs

rom = "/Users/simond/kick32.a1200.rom"

[machine]
profile = "A1200"

[memory]
fast = "8M"

[floppy]
speed = 0            # turbo: devsoak fills/audits the range at warp

[floppy.df0]
path = "blank.adf"
write_protected = false      # default is true; devsoak is destructive

[serial]
mode = "stdout"
